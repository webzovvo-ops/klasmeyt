<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Koleheyo ni speed</title>
<meta name="description" content="Simple update board para sa subjects at group chat." />

<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0a0a0c" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Klase" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============== LOGIN GATE ============== -->
<div id="authGate" class="gate">
  <div class="gate-card">
    <div class="gate-mark" aria-hidden="true">
      <img src="koleheyo.jpg" alt="" class="gate-mark-img" onerror="this.style.display='none'" />
    </div>
    <h1 class="gate-title">koleheyo</h1>
    <p class="gate-sub">assignment ng mga qpal</p>

    <form id="loginForm" class="gate-form" novalidate>
      <label class="field">
        <span class="field-label">buong pangalan pare</span>
        <input id="nameInput" type="text" name="name" placeholder="e.g.  José Protasio Rizal Mercado y Alonso Realonda" autocomplete="name" required />
        <span class="field-hint">Gamitin mo tunay mong pangalan pls — para makikita to ng iba.</span>
      </label>

      <label class="field">
        <span class="field-label">password ng app, hindi password mong baliw ka</span>
        <div class="password-wrap">
          <input id="passwordInput" type="password" name="password" placeholder="Enter password" autocomplete="current-password" required />
          <button type="button" id="togglePassword" class="icon-btn ghost" aria-label="Show password">
            <i data-lucide="eye"></i>
          </button>
        </div>
      </label>

      <div id="gateError" class="gate-error" role="alert" hidden></div>

      <button type="submit" class="btn btn-primary btn-full">
        <span>Pasok ng baby</span>
        <i data-lucide="arrow-right"></i>
      </button>
    </form>
  </div>

  <button id="gateThemeToggle" class="icon-btn ghost gate-theme-toggle" aria-label="Toggle theme">
    <i data-lucide="sun-moon"></i>
  </button>
</div>

<!-- ============== APP ============== -->
<div id="app" class="app" hidden>

  <header class="topbar">
    <div class="topbar-title">
      <i data-lucide="book-open" class="topbar-mark"></i>
      <span id="viewTitle">Subjects</span>
    </div>
    <div class="topbar-actions">
      <button id="themeToggle" class="icon-btn ghost" aria-label="Toggle theme">
        <i data-lucide="sun-moon"></i>
      </button>
      <button id="settingsBtn" class="icon-btn ghost" aria-label="Open settings">
        <i data-lucide="menu"></i>
      </button>
    </div>
  </header>

  <main class="views">

    <!-- ---------- SUBJECTS VIEW ---------- -->
    <section id="subjectsView" class="view">
      <div class="view-toolbar">
        <p class="view-hint">Subjects at assignment notes dito boi</p>
        <button id="addSubjectBtn" class="btn btn-primary btn-sm">
          <i data-lucide="plus"></i>
          <span>Add</span>
        </button>
      </div>

      <div id="subjectsEmpty" class="empty-state" hidden>
        <i data-lucide="notebook-pen"></i>
        <p>Wala</p>
        <p class="empty-sub">add subject</p>
      </div>

      <div id="subjectsGrid" class="subjects-grid"></div>
    </section>

    <!-- ---------- CHATS VIEW ---------- -->
    <section id="chatsView" class="view hidden-view">
      <div id="chatMessages" class="chat-messages"></div>

      <form id="chatForm" class="chat-composer">
        <button type="button" id="attachImageBtn" class="icon-btn ghost" aria-label="Attach image">
          <i data-lucide="image-plus"></i>
        </button>
        <input type="file" id="imageInput" accept="image/*" hidden />
        <textarea id="chatInput" placeholder="Mag-type ng mensahe..." rows="1"></textarea>
        <button type="submit" class="icon-btn primary" aria-label="Send">
          <i data-lucide="send"></i>
        </button>
      </form>
    </section>

  </main>

  <nav class="bottom-nav">
    <div id="navIndicator" class="nav-indicator" aria-hidden="true"></div>
    <button class="nav-btn" data-view="subjects" aria-current="page">
      <i data-lucide="book-open"></i>
      <span>Subjects</span>
    </button>
    <button class="nav-btn" data-view="chats">
      <i data-lucide="message-circle"></i>
      <span>Chats</span>
    </button>
  </nav>
</div>

<!-- ============== SUBJECT MODAL ============== -->
<div id="subjectModal" class="modal-overlay" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 id="modalTitle">Add subject</h2>
      <button id="closeModalBtn" class="icon-btn ghost" aria-label="Close">
        <i data-lucide="x"></i>
      </button>
    </div>

    <form id="subjectForm" class="modal-form">
      <label class="field">
        <span class="field-label">Subject</span>
        <input id="subjectNameInput" type="text" placeholder="e.g. Calculus 2" required />
      </label>

      <label class="field field-grow">
        <span class="field-label">Assignment / note</span>
        <textarea id="subjectContentInput" placeholder="I-type dito ang assignment, reminder, o kahit anong update tungkol sa subject na ito..." required></textarea>
      </label>

      <label class="field">
        <span class="field-label">Due date (optional)</span>
        <input id="subjectDueInput" type="date" />
        <span class="field-hint">mawawala to sa due date pre</span>
      </label>

      <div class="modal-actions">
        <button type="button" id="deleteSubjectBtn" class="btn btn-danger-ghost" hidden>
          <i data-lucide="trash-2"></i>
          <span>Delete</span>
        </button>
        <div class="modal-actions-right">
          <button type="button" id="cancelSubjectBtn" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">
            <i data-lucide="check"></i>
            <span>Save</span>
          </button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- ============== SETTINGS DRAWER ============== -->
<div id="settingsOverlay" class="modal-overlay drawer-overlay" hidden>
  <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-header">
      <h2 id="settingsTitle">Settings</h2>
      <button id="closeSettingsBtn" class="icon-btn ghost" aria-label="Close">
        <i data-lucide="x"></i>
      </button>
    </div>

    <div class="drawer-body">
      <section class="settings-section">
        <span class="field-label">Account</span>
        <div class="account-card">
          <div id="accountAvatar" class="account-avatar"></div>
          <div class="account-info">
            <div id="accountName" class="account-name"></div>
            <div id="accountPosition" class="account-position" hidden></div>
          </div>
        </div>
        <p class="field-hint"></p>
        <button id="drawerLogoutBtn" class="btn btn-ghost btn-full">
          <i data-lucide="log-out"></i>
          <span>Log out</span>
        </button>
      </section>

      <section class="settings-section">
        <span class="field-label">About</span>
        <p class="about-text">Jesus loves you guys</p>
        <div id="aboutCredits" class="about-credits"></div>
      </section>

      <section class="settings-section">
        <span class="field-label">Add suggestion kung ano pwede (diko  marereveice yan HAHAHA)</span>
        <form id="suggestionForm" class="suggestion-form">
          <textarea id="suggestionInput" placeholder="May suggestion ka ba para sa app o sa klase?..." required></textarea>
          <button type="submit" class="btn btn-primary btn-sm">
            <i data-lucide="send"></i>
            <span>Send</span>
          </button>
        </form>
      </section>
    </div>
  </div>
</div>

<!-- ============== TOAST ============== -->
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="app.js"></script>
</body>
</html>
